name: Cross-OS Matrix CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # 1. KHAI BÁO MATRIX STRATEGY
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    # 2. CHẠY TRÊN HỆ ĐIỀU HÀNH TƯƠNG ỨNG TỪ MATRIX
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build and Test
      # Trỏ chính xác vào pom.xml của Bai04
      run: mvn -f Bai04/pom.xml clean test